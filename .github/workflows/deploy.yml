name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-public files
        # 作業ファイルは配信しない（.assetsignore だけに頼らない）。wrangler.jsonc と .assetsignore は Workers の deploy が読むので残す
        run: rm -rf CLAUDE.md CLAUDE.local.md AGENTS.md .claude .github .gitignore
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
